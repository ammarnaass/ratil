<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- ألوان الهوية البصرية المعتمدة لمنصة رتل -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61ECCD"/>
      <stop offset="50%" stop-color="#3ECFB2"/>
      <stop offset="100%" stop-color="#2BA890"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ECFB2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- خلفية مربعة بحواف ناعمة (Squircle) متناسقة مع أنظمة iOS و Android -->
  <rect width="64" height="64" rx="16" fill="#111318"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#2E333D" stroke-opacity="0.6"/>

  <!-- هالة التوهج الروحانية -->
  <circle cx="32" cy="32" r="26" fill="url(#emblemGlow)"/>

  <!-- رمز «المصحف المفتوح والموجة الصوتية المتكاملة» -->
  <g filter="url(#softGlow)">
    <!-- حامل المصحف (الرحلة الخشبية الشريفة) -->
    <path d="M22 47L32 39L42 47" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 43L39 43" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- صفحات المصحف الشريف المفتوح المنحنية بتناغم -->
    <path d="M32 37V20C32 20 27 17 18 19V36C27 34 32 37 32 37Z" fill="url(#primaryGrad)" fill-opacity="0.18" stroke="url(#primaryGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M32 37V20C32 20 37 17 46 19V36C37 34 32 37 32 37Z" fill="url(#primaryGrad)" fill-opacity="0.18" stroke="url(#primaryGrad)" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- خطوط تلاوة الآيات الهادئة داخل الصفحات -->
    <path d="M22 24C26 23.5 28 24.5 29 25" stroke="#61ECCD" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M21 28C25 27.5 27 28.5 29 29" stroke="#61ECCD" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M42 24C38 23.5 36 24.5 35 25" stroke="#61ECCD" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M43 28C39 27.5 37 28.5 35 29" stroke="#61ECCD" stroke-width="1.6" stroke-linecap="round"/>

    <!-- الموجات الصوتية الجانبية المعبرة عن «الصوت هو البطل» -->
    <!-- الجهة اليمنى (بداية التلاوة) -->
    <path d="M6 32H10M12 28V36M15 25V39" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- الجهة اليسرى (امتداد الصوت والترتيل) -->
    <path d="M49 25V39M52 28V36M54 32H58" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- شعلة النور العلوية المنبعثة من قلب المصحف -->
    <circle cx="32" cy="16" r="1.8" fill="#61ECCD"/>
  </g>
</svg>
