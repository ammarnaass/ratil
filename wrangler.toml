name = "ratil-admin-api"
main = "admin/src/admin-upload.js"
compatibility_date = "2024-04-01"

# إعداد ربط سلة التخزين Cloudflare R2
[[r2_buckets]]
binding = "R2"
bucket_name = "ratil-audio"
preview_bucket_name = "ratil-audio-preview"

# إعداد ربط مساحة Cloudflare KV للمزامنة المشفرة (Zero-Knowledge Sync)
[[kv_namespaces]]
binding = "RATIL_SYNC_KV"
id = "ratil_sync_kv_prod"
preview_id = "ratil_sync_kv_preview"

# المتغيرات البيئية (يتم تحديد القيمة السرية عبر: wrangler secret put ADMIN_SECRET)
[vars]
GITHUB_REPO = "ratil/ratil"

