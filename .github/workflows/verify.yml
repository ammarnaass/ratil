# .github/workflows/verify.yml
name: Verify Quran Text Integrity

on:
  schedule:
    - cron: '0 3 * * *' # يومياً الساعة 3:00 فجراً
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with: { python-version: '3.11' }

      - name: ✅ Verify Quran Text Checksums
        run: python scripts/verify-text.py
