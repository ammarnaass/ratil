# .github/workflows/deploy.yml

name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # فحص يومي صباحاً

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ① النص القرآني — يوقف كل شيء إن فشل
      - name: ✅ Verify Quran Text
        run: node scripts/verify-text.mjs

      # ② البيانات الثابتة
      - name: 📦 Build Data
        run: node scripts/build-data.mjs

      # ③ فهرس البحث
      - name: 🔍 Build Search Index
        run: node scripts/build-search.mjs

      # ④ البناء والتحقق من التطبيق
      - name: 🚀 Build Next.js
        run: npx next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

  health:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: 🏥 Health Check
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            https://ratil.app/api/health
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
